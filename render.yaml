# Render blueprint: Kotsu is a static site — built once, then served as files.
services:
  - type: web
    name: kotsu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # The desktop installers are too large for the repository, so they live in a GitHub release.
      # These addresses serve them from this site; a new version means changing the three targets.
      - type: rewrite
        source: /get/Kotsu-mac-arm64.dmg
        destination: https://github.com/Rounit002/kotsu/releases/download/v1.0.0/Kotsu-1.0.0-mac-arm64.dmg
      - type: rewrite
        source: /get/Kotsu-mac-x64.dmg
        destination: https://github.com/Rounit002/kotsu/releases/download/v1.0.0/Kotsu-1.0.0-mac-x64.dmg
      - type: rewrite
        source: /get/Kotsu-win-x64.exe
        destination: https://github.com/Rounit002/kotsu/releases/download/v1.0.0/Kotsu-1.0.0-win-x64.exe
      # The app handles its own addresses (/daily), so every path serves the same page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built files carry a hash in their name, so browsers may keep them for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
