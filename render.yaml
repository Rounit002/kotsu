# Render blueprint: Kotsu is a static site — built once, then served as files.
services:
  - type: web
    name: kotsu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # The app handles its own addresses (/daily), so every path serves the same page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built files carry a hash in their name, so browsers may keep them for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
